apply plugin: 'com.android.application'

android {
    namespace 'id.my.duniamu.learnearn'
    compileSdk 34

    defaultConfig {
        applicationId "id.my.duniamu.learnearn"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "2.3.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "learn-earn.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "yadstore2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "learnearn"
            keyPassword System.getenv("KEY_PASSWORD") ?: "yadstore2026"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // WAJIB: untuk generate BuildConfig
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:1.2.0'
}
